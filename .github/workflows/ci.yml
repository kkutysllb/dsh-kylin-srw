name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 精读 PDF 渲染走系统 CJK 字体回退链（pdfdoc.ts FONT_CANDIDATES）；
      # ubuntu runner 无预装中文字体 → 装 Noto CJK 让渲染测试在 CI 真跑而非 skip。
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # lib/ 是发布产物：源码改了但忘记重建/提交时，CI 必须红。
      - run: git diff --exit-code -- lib

      - run: pnpm smoke

      - run: pnpm smoke:negatives
